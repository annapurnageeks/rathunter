name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.13"
          - os: macos-latest
            python: "3.9"
          # the tests use a simulated Mac, so they run on Linux too
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -v tests
      - name: Scan the CI runner itself
        if: runner.os == 'macOS'
        run: python rathunter.py --all --no-color || [ $? -lt 2 ]
